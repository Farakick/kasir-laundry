<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Laundry Online</title>
    
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f6; }
        body { font-family: sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        /* Form Input */
        .card-input { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .total-box { background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .total-box strong { display: block; font-size: 1.5em; color: var(--primary); }
        
        /* Tombol */
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background-color: var(--primary); color: white; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #357abd; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* Notifikasi */
        #statusMsg { text-align: center; margin-top: 10px; font-size: 12px; color: green; display: none; }

        /* Area Struk (Hanya saat Print) */
        #printableArea { display: none; }
        @media print {
            body * { visibility: hidden; }
            .card-input { display: none; }
            #printableArea, #printableArea * { visibility: visible; }
            #printableArea { display: block; position: absolute; left: 0; top: 0; width: 58mm; font-family: 'Courier New', monospace; font-size: 12px; color: black; }
            .struk-header, .struk-footer { text-align: center; }
            .struk-body { border-top: 1px dashed #000; border-bottom: 1px dashed #000; margin: 5px 0; padding: 5px 0; }
            .flex-between { display: flex; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div class="card-input">
        <h2 style="text-align:center; margin-top:0;">🧼 Kasir Laundry</h2>
        
        <div class="form-group">
            <label>Nama Pelanggan</label>
            <input type="text" id="nama" placeholder="Nama pelanggan...">
        </div>
        
        <div class="form-group">
            <label>Layanan</label>
            <select id="layanan">
                <option value="Cuci Kering">Cuci Kering</option>
                <option value="Cuci Basah">Cuci Basah</option>
                <option value="Setrika">Setrika Saja</option>
            </select>
        </div>

        <div style="display:flex; gap:10px;">
            <div class="form-group" style="flex:1">
                <label>Berat (Kg)</label>
                <input type="number" id="berat" value="1" oninput="hitung()">
            </div>
            <div class="form-group" style="flex:1">
                <label>Harga/Kg</label>
                <input type="number" id="harga" value="6000" oninput="hitung()">
            </div>
        </div>

        <div class="total-box">
            <span>Total Bayar</span>
            <strong id="displayTotal">Rp 6.000</strong>
        </div>

        <button id="btnCetak" onclick="prosesTransaksi()">🖨️ Cetak & Simpan</button>
        <p id="statusMsg">✅ Data tersimpan ke Google Sheets!</p>
    </div>

    <div id="printableArea">
        <div class="struk-header">
            <h3>Arie Loundry</h3>
            <p>Graha Surya Indah BLK J.05<br>WA: 0877-8438-8434</p>
            <p id="struk-date" style="font-size:10px; text-align:left;"></p>
        </div>
        <div class="struk-body">
            <div class="flex-between"><span>Plg:</span><span id="struk-nama"></span></div>
            <div class="flex-between"><span id="struk-layanan"></span></div>
            <div class="flex-between">
                <span id="struk-detail"></span>
                <span id="struk-total"></span>
            </div>
        </div>
        <div class="struk-footer">
            <p>Terima Kasih!</p>
        </div>
    </div>

    <script>
        // --- KONFIGURASI PENTING ---
        // MASUKKAN URL DARI GOOGLE APPS SCRIPT DI SINI (Pastikan dalam tanda kutip)
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwt-ySg3pW9CWH4cqFcp83CVVOf4oEDo8MPOI-o6SqpfWO6aN__uKkz3L2VEz1U6upc0Q/exec'; 

        function formatRupiah(n) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);
        }

        function hitung() {
            let b = document.getElementById('berat').value || 0;
            let h = document.getElementById('harga').value || 0;
            document.getElementById('displayTotal').innerText = formatRupiah(b * h);
        }

        function prosesTransaksi() {
            // 1. Ambil Data
            const data = {
                nama: document.getElementById('nama').value || 'Umum',
                layanan: document.getElementById('layanan').value,
                berat: document.getElementById('berat').value,
                harga: document.getElementById('harga').value,
                total: (document.getElementById('berat').value * document.getElementById('harga').value)
            };

            // 2. Update Tampilan Struk
            document.getElementById('struk-date').innerText = new Date().toLocaleString();
            document.getElementById('struk-nama').innerText = data.nama;
            document.getElementById('struk-layanan').innerText = data.layanan;
            document.getElementById('struk-detail').innerText = `${data.berat}kg x ${data.harga}`;
            document.getElementById('struk-total').innerText = formatRupiah(data.total);

            // 3. Kirim ke Google Sheets (Background Process)
            kirimKeGoogle(data);

            // 4. Buka Print Preview
            window.print();
        }

        function kirimKeGoogle(dataJson) {
            const btn = document.getElementById('btnCetak');
            const msg = document.getElementById('statusMsg');
            
            // Ubah tombol jadi loading
            btn.disabled = true;
            btn.innerText = "Sedang menyimpan...";
            msg.style.display = 'none';

            if (GOOGLE_SCRIPT_URL === 'PASTE_URL_PANJANG_DARI_GOOGLE_DISINI') {
                alert("URL Google Script belum diisi di kodingan!");
                btn.disabled = false;
                btn.innerText = "🖨️ Cetak & Simpan";
                return;
            }

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // Penting agar tidak error di browser
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataJson)
            }).then(() => {
                // Berhasil
                btn.disabled = false;
                btn.innerText = "🖨️ Cetak & Simpan";
                msg.style.display = 'block';
                
                // Reset form opsional
                // document.getElementById('nama').value = '';
                
            }).catch(err => {
                console.error(err);
                alert("Gagal menyimpan ke Google Sheets (Cek Koneksi)");
                btn.disabled = false;
                btn.innerText = "🖨️ Cetak & Simpan";
            });
        }
    </script>
</body>
</html>
